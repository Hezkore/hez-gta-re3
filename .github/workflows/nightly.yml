name: nightly

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # the bug form gets a commit after each nightly, which is no reason to build or list in the changelog
  FORM_FILES: .github/ISSUE_TEMPLATE

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.compare.outputs.build }}
      tag: ${{ steps.compare.outputs.tag }}
      master: ${{ steps.compare.outputs.master }}
      miami: ${{ steps.compare.outputs.miami }}
      lcs: ${{ steps.compare.outputs.lcs }}
      prev_master: ${{ steps.compare.outputs.prev_master }}
      prev_miami: ${{ steps.compare.outputs.prev_miami }}
      prev_lcs: ${{ steps.compare.outputs.prev_lcs }}
    steps:
      - name: Compare every branch against the last nightly
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh api repos/${{ github.repository }}/releases \
            --jq '[.[] | select(.tag_name | startswith("nightly-"))] | first | .body // ""' | tr -d '\r')

          only_forms() {
            local files
            [ -n "$1" ] || return 1
            files=$(gh api "repos/${{ github.repository }}/compare/$1...$2" --jq '.files[].filename') || return 1
            ! grep -qv "^$FORM_FILES/" <<< "$files"
          }

          build=no
          for branch in master miami lcs; do
            sha=$(gh api repos/${{ github.repository }}/commits/$branch --jq .sha)
            # notes edited on the web come back with \r\n, and older nightlies name every branch on one line
            prev=$(echo "$body" | grep '^Built from ' | grep -o "\b$branch [0-9a-f]\{40\}\b" | cut -d' ' -f2 || true)
            if [ "$sha" != "$prev" ] && ! only_forms "$prev" "$sha"; then
              build=yes
            fi
            echo "$branch=$sha" >> $GITHUB_OUTPUT
            echo "prev_$branch=$prev" >> $GITHUB_OUTPUT
          done

          if [ "$build" = "no" ]; then
            echo "No branch has moved since the last nightly."
          fi
          echo "build=$build" >> $GITHUB_OUTPUT
          echo "tag=nightly-$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

  build:
    needs: check
    if: needs.check.outputs.build == 'yes'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { game: re3, branch: master, os: ubuntu-latest, platform: linux-amd64-librw_gl3_glfw-oal, asset: re3-linux-amd64-opengl }
          - { game: re3, branch: master, os: windows-2022, platform: win-amd64-librw_d3d9-oal, asset: re3-windows-amd64-d3d9 }
          - { game: reVC, branch: miami, os: ubuntu-latest, platform: linux-amd64-librw_gl3_glfw-oal, asset: reVC-linux-amd64-opengl }
          - { game: reVC, branch: miami, os: windows-2022, platform: win-amd64-librw_d3d9-oal, asset: reVC-windows-amd64-d3d9 }
          - { game: reLCS, branch: lcs, os: ubuntu-latest, platform: linux-amd64-librw_gl3_glfw-oal, asset: reLCS-alpha-linux-amd64-opengl }
          - { game: reLCS, branch: lcs, os: windows-2022, platform: win-amd64-librw_d3d9-oal, asset: reLCS-alpha-windows-amd64-d3d9 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          submodules: true

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libopenal-dev libsndfile1-dev libmpg123-dev libgl1-mesa-dev

      - name: Build
        if: runner.os == 'Linux'
        run: |
          ./premake5Linux --with-librw --no-x11-keyboard gmake2
          make -C build config=release_${{ matrix.platform }}
          mv bin/${{ matrix.platform }}/Release/${{ matrix.game }} gamefiles/

      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Build
        if: runner.os == 'Windows'
        run: |
          ./premake5.exe vs2019 --with-librw --no-full-paths
          msbuild -m build/${{ matrix.game }}.sln /property:Configuration=Release /property:Platform=${{ matrix.platform }}
          mv bin/${{ matrix.platform }}/Release/${{ matrix.game }}.exe gamefiles/
          mv vendor/mpg123/dist/Win64/libmpg123-0.dll gamefiles/
          mv vendor/openal-soft/dist/Win64/OpenAL32.dll gamefiles/

      - name: Pack
        shell: bash
        run: |
          asset=${{ matrix.asset }}.zip
          echo "Version: ${{ needs.check.outputs.tag }}" > gamefiles/VERSION.txt
          if [ "$RUNNER_OS" = "Linux" ]; then
            (cd gamefiles && zip -r "../$asset" .)
          else
            (cd gamefiles && 7z a "../$asset" .)
          fi
          echo "asset=$asset" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.asset }}
          path: ${{ env.asset }}

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Write the changelog
        run: |
          git fetch origin master miami lcs

          log() {
            if [ -z "$1" ]; then
              echo "* first nightly"
              return
            fi
            # the branch's own line only, so a merged pull request is one entry with its title
            # instead of every commit inside it
            changes=$(git log --first-parent --format='%H %P' "$1..$2" -- . ":!$FORM_FILES" | while read -r commit parent merged; do
              if [ -n "$merged" ]; then
                pull_request=$(git log -1 --format='%s' "$commit" | sed -n 's/^Merge pull request #\([0-9]*\) from \([^/]*\)\/.*/#\1 by \2/p')
                title=$(git log -1 --format='%b' "$commit" | sed '/^$/d' | head -n 1)
                if [ -n "$pull_request" ]; then
                  echo "* ${title:-pull request} ($pull_request)"
                else
                  echo "* $(git log -1 --format='%s' "$commit")"
                fi
              else
                git log -1 --format='%B' "$commit" | sed '/^$/d; s/^/* /'
              fi
            done)
            echo "${changes:-* no changes}"
          }

          {
            echo "## GTA 3"
            echo
            log "${{ needs.check.outputs.prev_master }}" "${{ needs.check.outputs.master }}"
            echo
            echo "## GTA: Vice City"
            echo
            log "${{ needs.check.outputs.prev_miami }}" "${{ needs.check.outputs.miami }}"
            echo
            echo "## GTA: Liberty City Stories (alpha)"
            echo
            log "${{ needs.check.outputs.prev_lcs }}" "${{ needs.check.outputs.lcs }}"
            echo
            echo "Built from master ${{ needs.check.outputs.master }}."
            echo "Built from miami ${{ needs.check.outputs.miami }}."
            echo "Built from lcs ${{ needs.check.outputs.lcs }}."
          } > changelog.md

          cat changelog.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ needs.check.outputs.tag }}
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" assets/* \
            --title "Nightly ${tag#nightly-}" \
            --notes-file changelog.md \
            --prerelease \
            --target ${{ needs.check.outputs.master }}

      - name: Keep the ten newest nightlies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tags are nightly-YYYY-MM-DD, the same order the bug form lists them in
          gh release list --limit 100 --json tagName \
            --jq '[.[].tagName | select(startswith("nightly-"))] | sort | reverse | .[10:] | .[]' |
          while read -r tag; do
            echo "Removing $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: List the nightlies in the bug form
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # master may move while the nightly builds, so start from the newest master and retry when a push fails
          for attempt in 1 2 3; do
            git fetch -q origin master
            git checkout -q -B master origin/master
            .github/nightly-versions.sh
            if git diff --quiet; then
              echo "The bug form already lists these nightlies."
              exit 0
            fi
            git commit -q -am "update the bug form versions"
            if git push -q origin master; then
              exit 0
            fi
          done
          echo "Could not push the bug form versions after $attempt tries." >&2
          exit 1
